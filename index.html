<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOBAL TRENDS RADAR | 全球即時熱搜雷達</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #ef4444;
      --accent-dark: #dc2626;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 20px 16px;
      text-align: center;
    }
    header h1 {
      font-size: 1.45rem;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    header p {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }
    /* 後台統計面板 (?stats=1 開啟) */
    #stats-panel {
      display: none;
      background: #1f2937;
      color: #f9fafb;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.88rem;
    }
    #stats-panel h3 {
      margin-bottom: 8px;
      color: #34d399;
      font-size: 1rem;
    }
    .stats-btn {
      margin-top: 8px;
      background: #374151;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    /* 置頂 Smartlink 直連高點擊按鈕 */
    .viral-banner {
      display: block;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.28);
      transition: transform 0.15s ease;
    }
    .viral-banner:hover {
      transform: translateY(-2px);
    }
    /* 地區篩選列 */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .filter-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }
    /* Native Banner 原生廣告容器 */
    .native-ad-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
      min-height: 90px;
    }
    /* 熱搜卡片列表 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: box-shadow 0.15s ease;
    }
    .card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }
    .card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #e5e7eb;
    }
    .card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      margin-bottom: 8px;
    }
    .region-tag {
      background: #eef2ff;
      color: #3730a3;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .traffic-tag {
      color: var(--accent-dark);
      font-weight: 700;
    }
    .keyword {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }
    .hook {
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 12px;
      flex: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .read-link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }
    .read-link:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>🌍 GLOBAL TRENDS RADAR</h1>
    <p id="update-time">全球即時熱搜雷達 · 載入最新數據中...</p>
  </header>

  <div class="container">
    <!-- 點擊率監測面板（網址加上 ?stats=1 時顯示） -->
    <div id="stats-panel">
      <h3>📊 本機點擊率與熱度追蹤面板</h3>
      <div id="stats-content">尚無點擊紀錄</div>
      <button class="stats-btn" onclick="resetStats()">重置統計數據</button>
    </div>

    <!-- Adsterra Smartlink 置頂直連按鈕 -->
    <a class="viral-banner"
       href="https://asiafilm.org/4/c9fd036ccb50a1833d362caf25bf03ec"
       target="_blank"
       rel="noopener noreferrer"
       onclick="logClick('置頂Smartlink按鈕')">
      🔥 全球熱搜 Top 1 完整爆紅懶人包 ➔ 點擊立即查看
    </a>

    <!-- 地區切換篩選器 -->
    <div class="filters">
      <button class="filter-btn active" onclick="filterRegion('ALL', this)">🌐 全部地區</button>
      <button class="filter-btn" onclick="filterRegion('US', this)">🇺🇸 美國熱搜</button>
      <button class="filter-btn" onclick="filterRegion('GB', this)">🇬🇧 英國熱搜</button>
      <button class="filter-btn" onclick="filterRegion('TW', this)">🇹🇼 台灣熱搜</button>
      <button class="filter-btn" onclick="filterRegion('JP', this)">🇯🇵 日本熱搜</button>
    </div>

    <!-- Adsterra Native Banner 原生廣告區塊 -->
    <div class="native-ad-box">
      <script async="async" data-cfasync="false" src="https://bicea.org/21/8fd6b14a893555a55d0b13d0062e2728"></script>
      <div id="container-8fd6b14a893555a55d0b13d0062e2728"></div>
    </div>

    <!-- 熱搜新聞卡片網格 -->
    <div id="trends-grid" class="grid"></div>
  </div>

  <footer>
    Global Trends Radar · Automated Real-Time Search Intelligence
  </footer>

  <script>
    let allItems = [];
    let currentRegion = 'ALL';

    function logClick(label) {
      try {
        const stats = JSON.parse(localStorage.getItem('sigma_clicks') || '{}');
        stats[label] = (stats[label] || 0) + 1;
        localStorage.setItem('sigma_clicks', JSON.stringify(stats));
        renderStats();
      } catch (e) {}
    }

    function resetStats() {
      localStorage.removeItem('sigma_clicks');
      renderStats();
    }

    function renderStats() {
      const params = new URLSearchParams(window.location.search);
      const panel = document.getElementById('stats-panel');
      if (params.get('stats') !== '1') return;
      panel.style.display = 'block';
      const stats = JSON.parse(localStorage.getItem('sigma_clicks') || '{}');
      const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
      if (entries.length === 0) {
        document.getElementById('stats-content').innerText = '尚無點擊紀錄';
        return;
      }
      document.getElementById('stats-content').innerHTML = entries
        .map(([k, v]) => `• ${k}：<strong>${v}</strong> 次`)
        .join('<br>');
    }

    function filterRegion(code, btn) {
      currentRegion = code;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('trends-grid');
      const filtered = currentRegion === 'ALL'
        ? allItems
        : allItems.filter(item => item.code === currentRegion);

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:#6b7280;">目前尚無此地區熱搜資料，請稍候自動更新。</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <article class="card">
          ${item.picture ? `<img class="card-img" src="${item.picture}" alt="${item.keyword}" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="card-body">
            <div class="badges">
              <span class="region-tag">${item.region}</span>
              <span class="traffic-tag">${item.traffic}</span>
            </div>
            <h2 class="keyword">${item.keyword}</h2>
            <p class="hook">${item.hook}</p>
            <div class="card-footer">
              <span>來源：${item.source}</span>
              <a class="read-link"
                 href="${item.url}"
                 target="_blank"
                 rel="noopener noreferrer"
                 onclick="logClick('${item.code} - ${item.keyword.replace(/'/g, "")}')">
                查看懶人包 ↗
              </a>
            </div>
          </div>
        </article>
      `).join('');
    }

    async function loadTrends() {
      try {
        const res = await fetch('trends.json?t=' + Date.now());
        const data = await res.json();
        allItems = data.items || [];
        document.getElementById('update-time').innerText =
          `最後更新時間：${data.updated_at} (GMT+8) · 共收錄 ${data.total} 筆全球即時話題`;
        renderCards();
      } catch (err) {
        document.getElementById('update-time').innerText = '熱搜數據載入失敗，請重新整理頁面';
      }
    }

    renderStats();
    loadTrends();
  </script>

  <!-- 若之後要加 Monetag In-Page Push 代碼，直接貼在這行下方即可 -->
</body>
</html>
