<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA PULSE | 全球即時熱搜與爆紅情報雷達</title>
  <meta name="description" content="24小時全自動追蹤美國、英國、台灣、日本 Google 破百萬即時熱搜話題與懶人包。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070a11;
      --bg-surface: #0f1623;
      --bg-card: #131c2e;
      --bg-card-hover: #182338;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --crimson: #ff2e4c;
      --crimson-glow: rgba(255, 46, 76, 0.35);
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --emerald: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(255, 46, 76, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
    }

    /* 1. 頂部即時快訊跑馬燈 */
    .ticker-bar {
      background: #04060b;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      height: 36px;
      overflow: hidden;
      font-size: 0.8rem;
    }
    .ticker-label {
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      letter-spacing: 0.5px;
      z-index: 2;
      box-shadow: 4px 0 12px rgba(0,0,0,0.5);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .ticker-track-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .ticker-track {
      display: inline-flex;
      gap: 32px;
      white-space: nowrap;
      padding-left: 20px;
      animation: marquee 45s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      color: var(--text-sub);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .ticker-item:hover { color: #fff; }
    .ticker-item strong { color: var(--text-main); }
    .ticker-hot {
      color: var(--crimson);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
    }

    /* 2. 玻璃擬態導覽列 */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 10, 17, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--crimson), #ff6b35);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 0 18px var(--crimson-glow);
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .brand-title span { color: var(--crimson); }
    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 520px;
      justify-content: flex-end;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 300px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px 8px 34px;
      border-radius: 999px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      opacity: 0.6;
    }
    .live-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 主容器 */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 後台統計面板 (?stats=1) */
    #stats-panel {
      display: none;
      background: #0d1320;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    #stats-panel h3 { color: var(--emerald); margin-bottom: 10px; }
    .stats-btn {
      margin-top: 10px;
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 3. 篩選與排序控制列 */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .region-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .tab-btn:hover {
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .tab-btn.active {
      background: var(--text-main);
      color: #070a11;
      border-color: var(--text-main);
      font-weight: 800;
    }
    .tab-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.2);
    }
    .sort-select {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* 4. 頭條 Bento Grid 焦點區 */
    .hero-bento {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) {
      .hero-bento { grid-template-columns: 1fr; }
    }

    .hero-main {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      min-height: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 26px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .hero-main:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.48;
      transition: transform 0.4s ease;
    }
    .hero-main:hover .hero-bg { transform: scale(1.03); }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #070a11 12%, rgba(7, 10, 17, 0.72) 55%, rgba(7, 10, 17, 0.2) 100%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .badge-top1 {
      background: var(--crimson);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 14px var(--crimson-glow);
    }
    .badge-region {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .badge-traffic {
      font-family: 'JetBrains Mono', monospace;
      color: var(--amber);
      font-weight: 700;
      font-size: 0.82rem;
    }
    .hero-title {
      font-size: clamp(1.45rem, 2.6vw, 2.05rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #fff;
    }
    .hero-hook {
      color: #cbd5e1;
      font-size: 0.96rem;
      margin-bottom: 18px;
      max-width: 640px;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn-primary {
      background: #fff;
      color: #070a11;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-primary:hover {
      background: var(--cyan);
      transform: translateY(-1px);
    }
    .btn-share {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 600;
      font-size: 0.84rem;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-share:hover { background: rgba(255, 255, 255, 0.2); }

    /* 右側雙卡片欄（第2名 ＋ 高轉化 Smartlink 情報卡） */
    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .side-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }
    .side-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    /* 高點擊 Smartlink 情報特輯卡 */
    .smartlink-card {
      background: linear-gradient(145deg, #1b1124 0%, #2a1226 50%, #161c2e 100%);
      border: 1px solid rgba(255, 46, 76, 0.45);
      box-shadow: 0 8px 28px rgba(255, 46, 76, 0.15);
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .smartlink-card::after {
      content: "HOT";
      position: absolute;
      right: -18px;
      top: 12px;
      background: var(--crimson);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 3px 24px;
      transform: rotate(35deg);
    }
    .smartlink-tag {
      color: #ff6b81;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: inline-block;
    }
    .smartlink-title {
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .smartlink-desc {
      font-size: 0.84rem;
      color: #cbd5e1;
      margin-bottom: 14px;
    }
    .smartlink-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 9px;
      width: 100%;
    }

    /* 5. 無痕原生廣告容器（沒廣告時自動隱形，不留白框） */
    .native-ad-wrapper {
      margin-bottom: 24px;
      border-radius: 14px;
      overflow: hidden;
    }

    /* 6. 雜誌情報網格 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      background: var(--bg-card-hover);
    }

    /* 封面圖 ＋ 無圖自動雜誌封面生成 */
    .card-media {
      position: relative;
      height: 165px;
      width: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }
    .card:hover .card-media img { transform: scale(1.05); }
    .fallback-cover {
      width: 100%;
      height: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.22), transparent 60%),
        linear-gradient(135deg, #162033 0%, #0b111e 100%);
    }
    .fallback-cover span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      opacity: 0.8;
      margin-bottom: 4px;
    }
    .fallback-cover div {
      font-size: 1.15rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.88);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .media-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .pill-region {
      background: rgba(7, 10, 17, 0.78);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .pill-traffic {
      background: rgba(7, 10, 17, 0.85);
      backdrop-filter: blur(8px);
      color: var(--amber);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card-body {
      padding: 16px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-keyword {
      font-size: 1.12rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .card-hook {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      gap: 8px;
    }
    .source-name {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }
    .card-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mini-share {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.76rem;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mini-share:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .read-cta {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .read-cta:hover {
      background: var(--cyan);
      color: #070a11;
    }

    /* Toast 提示通知 */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #10b981;
      color: #042f2e;
      font-weight: 800;
      font-size: 0.86rem;
      padding: 11px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    footer {
      margin-top: 48px;
      border-top: 1px solid var(--border);
      padding: 28px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- 1. 全球即時熱搜跑馬燈 -->
  <div class="ticker-bar">
    <div class="ticker-label"><span class="pulse-dot"></span> LIVE 飆升榜</div>
    <div class="ticker-track-wrap">
      <div class="ticker-track" id="ticker-track">
        <span class="ticker-item">正在同步全球 4 大地區 Google Trends 即時數據...</span>
      </div>
    </div>
  </div>

  <!-- 2. 玻璃擬態頂部導覽列 -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="./" class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-title">SIGMA <span>PULSE</span></div>
          <div class="brand-sub">GLOBAL VIRAL INTELLIGENCE</div>
        </div>
      </a>

      <div class="nav-tools">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜尋關鍵字、話題、人物..." oninput="handleSearch()" />
        </div>
        <div class="live-status" id="update-badge">SYNCING...</div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 點擊追蹤面板 (?stats=1) -->
    <div id="stats-panel">
      <h3>📊 SIGMA PULSE 即時點擊漏斗監測</h3>
      <div id="stats-content">尚無點擊紀錄</div>
      <button class="stats-btn" onclick="resetStats()">重置本地數據</button>
    </div>

    <!-- 3. 地區切換與熱度排序列 -->
    <div class="controls-bar">
      <div class="region-tabs" id="region-tabs">
        <button class="tab-btn active" data-code="ALL" onclick="setRegion('ALL', this)">🌐 全球總覽 <span class="tab-count" id="cnt-ALL">0</span></button>
        <button class="tab-btn" data-code="US" onclick="setRegion('US', this)">🇺🇸 美國 <span class="tab-count" id="cnt-US">0</span></button>
        <button class="tab-btn" data-code="GB" onclick="setRegion('GB', this)">🇬🇧 英國 <span class="tab-count" id="cnt-GB">0</span></button>
        <button class="tab-btn" data-code="TW" onclick="setRegion('TW', this)">🇹🇼 台灣 <span class="tab-count" id="cnt-TW">0</span></button>
        <button class="tab-btn" data-code="JP" onclick="setRegion('JP', this)">🇯🇵 日本 <span class="tab-count" id="cnt-JP">0</span></button>
      </div>

      <select class="sort-select" id="sort-select" onchange="renderAll()">
        <option value="traffic">🔥 依搜尋熱度排序 (最高優先)</option>
        <option value="default">⚡ 依最新抓取代排序</option>
      </select>
    </div>

    <!-- 4. 雜誌級 Hero Bento 焦點頭條區 -->
    <section class="hero-bento" id="hero-bento"></section>

    <!-- 5. 無痕原生廣告區塊（Adsterra Native Banner） -->
    <div class="native-ad-wrapper">
      <script async="async" data-cfasync="false" src="https://bicea.org/21/8fd6b14a893555a55d0b13d0062e2728"></script>
      <div id="container-8fd6b14a893555a55d0b13d0062e2728"></div>
    </div>

    <!-- 6. 完整情報網格 -->
    <div class="section-header">
      <h2 class="section-title">📡 即時趨勢雷達流</h2>
      <span id="result-count" style="font-size:0.8rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;"></span>
    </div>
    <section class="grid" id="trends-grid"></section>
  </main>

  <div id="toast">✅ 已複製爆文標題與網址，快去 Threads / X 貼上引流！</div>

  <footer>
    SIGMA PULSE · Automated Global Search Radar · Updated Every 2 Hours
  </footer>

  <script>
    const SMARTLINK_URL = "https://asiafilm.org/4/c9fd036ccb50a1833d362caf25bf03ec";
    let allItems = [];
    let currentRegion = 'ALL';
    let searchQuery = '';

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseTraffic(trafficStr) {
      if (!trafficStr) return 0;
      const clean = trafficStr.toUpperCase().replace(/[^0-9.KM]/g, '');
      if (clean.includes('M')) return parseFloat(clean) * 1000000;
      if (clean.includes('K')) return parseFloat(clean) * 1000;
      return parseFloat(clean) || 0;
    }

    function logClick(label) {
      try {
        const stats = JSON.parse(localStorage.getItem('sigma_clicks') || '{}');
        stats[label] = (stats[label] || 0) + 1;
        localStorage.setItem('sigma_clicks', JSON.stringify(stats));
        renderStats();
      } catch (e) {}
    }

    function resetStats() {
      localStorage.removeItem('sigma_clicks');
      renderStats();
    }

    function renderStats() {
      const params = new URLSearchParams(window.location.search);
      const panel = document.getElementById('stats-panel');
      if (params.get('stats') !== '1') return;
      panel.style.display = 'block';
      const stats = JSON.parse(localStorage.getItem('sigma_clicks') || '{}');
      const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
      document.getElementById('stats-content').innerHTML = entries.length === 0
        ? '尚無點擊紀錄'
        : entries.map(([k, v]) => `• ${esc(k)}：<strong>${v}</strong> 次`).join('<br>');
    }

    function copyViralPost(keyword, hook, traffic) {
      const siteUrl = window.location.origin + window.location.pathname;
      const text = `🔥 剛剛衝上熱搜（${traffic}）：${keyword}\n${hook}\n👇 完整爆紅原因懶人包：\n${siteUrl}`;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2600);
        logClick('複製引流文案');
      });
    }

    function setRegion(code, btn) {
      currentRegion = code;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderAll();
    }

    function updateCounts() {
      document.getElementById('cnt-ALL').innerText = allItems.length;
      ['US', 'GB', 'TW', 'JP'].forEach(code => {
        const el = document.getElementById('cnt-' + code);
        if (el) el.innerText = allItems.filter(i => i.code === code).length;
      });
    }

    function renderTicker() {
      const sorted = [...allItems].sort((a, b) => parseTraffic(b.traffic) - parseTraffic(a.traffic)).slice(0, 12);
      if (!sorted.length) return;
      const html = sorted.map(item => `
        <a class="ticker-item" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('跑馬燈-${esc(item.keyword)}')">
          <span>${esc(item.region)}</span>
          <strong>${esc(item.keyword)}</strong>
          <span class="ticker-hot">${esc(item.traffic)}</span>
        </a>
      `).join('');
      document.getElementById('ticker-track').innerHTML = html + html;
    }

    function buildSmartlinkCard() {
      return `
        <a class="side-card smartlink-card"
           href="${SMARTLINK_URL}"
           target="_blank"
           rel="noopener noreferrer"
           onclick="logClick('Hero高轉化情報卡')">
          <div>
            <span class="smartlink-tag">⚡ AI 演算法即時預測 · 破百萬潛力榜</span>
            <h3 class="smartlink-title">全球正在瘋傳但新聞還沒報的 Top 1 爆紅內幕</h3>
            <p class="smartlink-desc">系統偵測過去 60 分鐘跨國搜尋量暴增 480%，點擊立即解鎖完整事件懶人包與現場影片。</p>
          </div>
          <div class="smartlink-cta">立即解鎖完整懶人包 ➔</div>
        </a>
      `;
    }

    function renderAll() {
      const sortMode = document.getElementById('sort-select').value;
      let filtered = allItems.filter(item => {
        const matchRegion = currentRegion === 'ALL' || item.code === currentRegion;
        const matchSearch = !searchQuery ||
          (item.keyword && item.keyword.toLowerCase().includes(searchQuery)) ||
          (item.hook && item.hook.toLowerCase().includes(searchQuery));
        return matchRegion && matchSearch;
      });

      if (sortMode === 'traffic') {
        filtered.sort((a, b) => parseTraffic(b.traffic) - parseTraffic(a.traffic));
      }

      document.getElementById('result-count').innerText = `顯示 ${filtered.length} 筆即時話題`;

      const heroEl = document.getElementById('hero-bento');
      const gridEl = document.getElementById('trends-grid');

      if (filtered.length === 0) {
        heroEl.innerHTML = '';
        gridEl.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px 0;">找不到符合條件的熱搜話題，請嘗試其他關鍵字。</p>';
        return;
      }

      // Hero #1 頭條與右側雙卡
      const top1 = filtered[0];
      const top2 = filtered[1];

      const sideTopHtml = top2 ? `
        <article class="side-card">
          <div>
            <div class="hero-badges" style="margin-bottom:8px;">
              <span class="badge-region">${esc(top2.region)}</span>
              <span class="badge-traffic">${esc(top2.traffic)}</span>
            </div>
            <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:6px;color:#fff;">${esc(top2.keyword)}</h3>
            <p style="font-size:0.85rem;color:var(--text-sub);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(top2.hook)}</p>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="source-name">來源：${esc(top2.source)}</span>
            <div class="card-btns">
              <button class="mini-share" onclick="copyViralPost('${esc(top2.keyword)}','${esc(top2.hook)}','${esc(top2.traffic)}')">📋 轉發</button>
              <a class="read-cta" href="${esc(top2.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('Hero2-${esc(top2.keyword)}')">看懶人包 ↗</a>
            </div>
          </div>
        </article>
      ` : '';

      heroEl.innerHTML = `
        <article class="hero-main">
          ${top1.picture ? `<img class="hero-bg" src="${esc(top1.picture)}" alt="${esc(top1.keyword)}" onerror="this.style.display='none'">` : ''}
          <div class="hero-gradient"></div>
          <div class="hero-content">
            <div class="hero-badges">
              <span class="badge-top1">👑 當前熱度 #1</span>
              <span class="badge-region">${esc(top1.region)}</span>
              <span class="badge-traffic">${esc(top1.traffic)}</span>
            </div>
            <h2 class="hero-title">${esc(top1.keyword)}</h2>
            <p class="hero-hook">${esc(top1.hook)}</p>
            <div class="hero-actions">
              <a class="btn-primary" href="${esc(top1.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('Hero1-${esc(top1.keyword)}')">
                閱讀完整事件始末 ↗
              </a>
              <button class="btn-share" onclick="copyViralPost('${esc(top1.keyword)}','${esc(top1.hook)}','${esc(top1.traffic)}')">
                📋 複製爆文引流
              </button>
            </div>
          </div>
        </article>
        <div class="hero-side">
          ${sideTopHtml}
          ${buildSmartlinkCard()}
        </div>
      `;

      // 其餘卡片（第 3 名起）
      const rest = filtered.slice(2);
      gridEl.innerHTML = rest.map(item => `
        <article class="card">
          <div class="card-media">
            ${item.picture
              ? `<img src="${esc(item.picture)}" alt="${esc(item.keyword)}" loading="lazy" onerror="this.outerHTML='<div class=\\'fallback-cover\\'><span>TRENDING INTEL</span><div>${esc(item.keyword)}</div></div>'">`
              : `<div class="fallback-cover"><span>TRENDING INTEL</span><div>${esc(item.keyword)}</div></div>`
            }
            <div class="media-badges">
              <span class="pill-region">${esc(item.region)}</span>
              <span class="pill-traffic">${esc(item.traffic)}</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-keyword">${esc(item.keyword)}</h3>
            <p class="card-hook">${esc(item.hook)}</p>
            <div class="card-footer">
              <span class="source-name">${esc(item.source)}</span>
              <div class="card-btns">
                <button class="mini-share" title="複製爆文引流文案" onclick="copyViralPost('${esc(item.keyword)}','${esc(item.hook)}','${esc(item.traffic)}')">📋 轉發</button>
                <a class="read-cta" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('${esc(item.code)}-${esc(item.keyword)}')">
                  查看懶人包 ↗
                </a>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    async function init() {
      renderStats();
      try {
        const res = await fetch('trends.json?t=' + Date.now());
        const data = await res.json();
        allItems = data.items || [];
        document.getElementById('update-badge').innerText = `LIVE · ${data.updated_at.slice(5)}`;
        updateCounts();
        renderTicker();
        renderAll();
      } catch (e) {
        document.getElementById('update-badge').innerText = 'OFFLINE';
      }
    }

    init();
  </script>
</body>
</html>
