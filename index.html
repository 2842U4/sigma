<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA PULSE | 全球即時熱搜與爆紅情報雷達</title>
  <meta name="description" content="24小時全自動追蹤美國、英國、台灣、日本 Google 破百萬即時熱搜話題與懶人包。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070a11;
      --bg-surface: #0f1623;
      --bg-card: #131c2e;
      --bg-card-hover: #182338;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --crimson: #ff2e4c;
      --crimson-glow: rgba(255, 46, 76, 0.35);
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --emerald: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(255, 46, 76, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
    }

    /* 1. 頂部即時快訊跑馬燈 */
    .ticker-bar {
      background: #04060b;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      height: 36px;
      overflow: hidden;
      font-size: 0.8rem;
    }
    .ticker-label {
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      letter-spacing: 0.5px;
      z-index: 2;
      box-shadow: 4px 0 12px rgba(0,0,0,0.5);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .ticker-track-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .ticker-track {
      display: inline-flex;
      gap: 32px;
      white-space: nowrap;
      padding-left: 20px;
      animation: marquee 45s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      color: var(--text-sub);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .ticker-item:hover { color: #fff; }
    .ticker-item strong { color: var(--text-main); }
    .ticker-hot {
      color: var(--crimson);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
    }

    /* 2. 玻璃擬態導覽列 */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 10, 17, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--crimson), #ff6b35);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 0 18px var(--crimson-glow);
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .brand-title span { color: var(--crimson); }
    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 520px;
      justify-content: flex-end;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 300px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px 8px 34px;
      border-radius: 999px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      opacity: 0.6;
    }
    .live-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 主容器 */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 後台統計面板 (?stats=1) */
    #stats-panel {
      display: none;
      background: #0d1320;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    #stats-panel h3 { color: var(--emerald); margin-bottom: 10px; }
    .stats-btn {
      margin-top: 10px;
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 3. 篩選與排序控制列 */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .region-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .tab-btn:hover {
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .tab-btn.active {
      background: var(--text-main);
      color: #070a11;
      border-color: var(--text-main);
      font-weight: 800;
    }
    .tab-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.2);
    }
    .sort-select {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* 4. 頭條 Bento Grid 焦點區 */
    .hero-bento {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) {
      .hero-bento { grid-template-columns: 1fr; }
    }

    .hero-main {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      min-height: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 26px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .hero-main:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.48;
      transition: transform 0.4s ease;
    }
    .hero-main:hover .hero-bg { transform: scale(1.03); }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #070a11 12%, rgba(7, 10, 17, 0.72) 55%, rgba(7, 10, 17, 0.2) 100%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .badge-top1 {
      background: var(--crimson);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 14px var(--crimson-glow);
    }
    .badge-region {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .badge-traffic {
      font-family: 'JetBrains Mono', monospace;
      color: var(--amber);
      font-weight: 700;
      font-size: 0.82rem;
    }
    .hero-title {
      font-size: clamp(1.45rem, 2.6vw, 2.05rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #fff;
    }
    .hero-hook {
      color: #cbd5e1;
      font-size: 0.96rem;
      margin-bottom: 18px;
      max-width: 640px;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn-primary {
      background: #fff;
      color: #070a11;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-primary:hover {
      background: var(--cyan);
      transform: translateY(-1px);
    }
    .btn-share {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 600;
      font-size: 0.84rem;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-share:hover { background: rgba(255, 255, 255, 0.2); }

    /* 右側雙卡片欄（第2名 ＋ 高轉化 Smartlink 情報卡） */
    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .side-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }
    .side-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    /* 高點擊 Smartlink 情報特輯卡 */
    .smartlink-card {
      background: linear-gradient(145deg, #1b1124 0%, #2a1226 50%, #161c2e 100%);
      border: 1px solid rgba(255, 46, 76, 0.45);
      box-shadow: 0 8px 28px rgba(255, 46, 76, 0.15);
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .smartlink-card::after {
      content: "HOT";
      position: absolute;
      right: -18px;
      top: 12px;
      background: var(--crimson);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 3px 24px;
      transform: rotate(35deg);
    }
    .smartlink-tag {
      color: #ff6b81;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: inline-block;
    }
    .smartlink-title {
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .smartlink-desc {
      font-size: 0.84rem;
      color: #cbd5e1;
      margin-bottom: 14px;
    }
    .smartlink-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 9px;
      width: 100%;
    }

    /* 5. 無痕原生廣告容器（沒廣告時自動隱形，不留白框） */
    .native-ad-wrapper {
      margin-bottom: 24px;
      border-radius: 14px;
      overflow: hidden;
    }

    /* 6. 雜誌情報網格 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 1.05rem;
      font
