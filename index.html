<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA PULSE | Global Real-Time Viral Intelligence (54 Countries)</title>
  <meta name="description" content="Real-time Google Trends & viral intelligence across 54 countries including US, India, UK, Brazil, Japan, Taiwan, and Europe." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060910;
      --bg-surface: #0e1522;
      --bg-card: #121b2d;
      --bg-card-hover: #17233a;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.45);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --crimson: #ff2e4c;
      --crimson-glow: rgba(255, 46, 76, 0.35);
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --emerald: #10b981;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 0%, rgba(255, 46, 76, 0.09) 0%, transparent 40%),
        radial-gradient(circle at 88% 8%, rgba(56, 189, 248, 0.09) 0%, transparent 40%);
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
    }

    /* 1. 頂部即時快訊跑馬燈 */
    .ticker-bar {
      background: #03050a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      height: 36px;
      overflow: hidden;
      font-size: 0.8rem;
    }
    .ticker-label {
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      letter-spacing: 0.5px;
      z-index: 2;
      box-shadow: 4px 0 14px rgba(0,0,0,0.6);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .ticker-track-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .ticker-track {
      display: inline-flex;
      gap: 32px;
      white-space: nowrap;
      padding-left: 20px;
      animation: marquee 55s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      color: var(--text-sub);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .ticker-item:hover { color: #fff; }
    .ticker-item strong { color: var(--text-main); }
    .ticker-hot {
      color: var(--crimson);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
    }

    /* 2. 玻璃擬態頂部導覽列 */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6, 9, 16, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-icon {
      width: 35px;
      height: 35px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--crimson), #ff6b35);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 0 18px var(--crimson-glow);
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .brand-title span { color: var(--crimson); }
    .brand-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .search-box {
      position: relative;
      width: 210px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 12px 7px 32px;
      border-radius: 999px;
      font-size: 0.82rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      opacity: 0.6;
    }
    .lang-switch {
      display: inline-flex;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-btn.active {
      background: var(--cyan);
      color: #060910;
    }
    .live-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 主容器 */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 後台統計面板 (?stats=1) */
    #stats-panel {
      display: none;
      background: #0d1320;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    #stats-panel h3 { color: var(--emerald); margin-bottom: 10px; }
    .stats-btn {
      margin-top: 10px;
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 3. 雙層地理控制列（洲別膠囊 + 54國下拉 + 熱度排序） */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .group-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s ease;
    }
    .tab-btn:hover {
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .tab-btn.active {
      background: var(--text-main);
      color: #060910;
      border-color: var(--text-main);
      font-weight: 800;
    }
    .tab-btn.local-highlight {
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--cyan);
    }
    .tab-btn.local-highlight.active {
      background: var(--cyan);
      color: #060910;
      border-color: var(--cyan);
    }

    .dropdown-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .control-select {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 230px;
    }
    .control-select:focus {
      border-color: var(--cyan);
    }

    /* 4. 頭條 Bento Grid 焦點區 */
    .hero-bento {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }
    @media (max-width: 880px) {
      .hero-bento { grid-template-columns: 1fr; }
    }

    .hero-main {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      min-height: 365px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 26px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .hero-main:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.48;
      transition: transform 0.4s ease;
    }
    .hero-main:hover .hero-bg { transform: scale(1.03); }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #060910 12%, rgba(6, 9, 16, 0.72) 55%, rgba(6, 9, 16, 0.18) 100%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .badge-top1 {
      background: var(--crimson);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 14px var(--crimson-glow);
    }
    .badge-region {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .badge-traffic {
      font-family: 'JetBrains Mono', monospace;
      color: var(--amber);
      font-weight: 700;
      font-size: 0.82rem;
    }
    .hero-title {
      font-size: clamp(1.45rem, 2.6vw, 2.05rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #fff;
    }
    .hero-hook {
      color: #cbd5e1;
      font-size: 0.96rem;
      margin-bottom: 18px;
      max-width: 640px;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn-primary {
      background: #fff;
      color: #060910;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-primary:hover {
      background: var(--cyan);
      transform: translateY(-1px);
    }
    .btn-share {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 600;
      font-size: 0.84rem;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-share:hover { background: rgba(255, 255, 255, 0.2); }

    /* 右側雙卡片欄 */
    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .side-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }
    .side-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    /* 高點擊 Smartlink 情報特輯卡 */
    .smartlink-card {
      background: linear-gradient(145deg, #1b1124 0%, #2a1226 50%, #161c2e 100%);
      border: 1px solid rgba(255, 46, 76, 0.45);
      box-shadow: 0 8px 28px rgba(255, 46, 76, 0.15);
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .smartlink-card::after {
      content: "HOT";
      position: absolute;
      right: -18px;
      top: 12px;
      background: var(--crimson);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 3px 24px;
      transform: rotate(35deg);
    }
    .smartlink-tag {
      color: #ff6b81;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: inline-block;
    }
    .smartlink-title {
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .smartlink-desc {
      font-size: 0.84rem;
      color: #cbd5e1;
      margin-bottom: 14px;
    }
    .smartlink-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 9px;
      width: 100%;
    }

    /* 5. 無痕原生廣告容器 */
    .native-ad-wrapper {
      margin-bottom: 24px;
      border-radius: 14px;
      overflow: hidden;
    }

    /* 6. 雜誌情報網格 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      background: var(--bg-card-hover);
    }

    .card-media {
      position: relative;
      height: 165px;
      width: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }
    .card:hover .card-media img { transform: scale(1.05); }
    .fallback-cover {
      width: 100%;
      height: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.22), transparent 60%),
        linear-gradient(135deg, #162033 0%, #0b111e 100%);
    }
    .fallback-cover span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      opacity: 0.8;
      margin-bottom: 4px;
    }
    .fallback-cover div {
      font-size: 1.15rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.88);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .media-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .pill-region {
      background: rgba(6, 9, 16, 0.82);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .pill-traffic {
      background: rgba(6, 9, 16, 0.86);
      backdrop-filter: blur(8px);
      color: var(--amber);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card-body {
      padding: 16px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-keyword {
      font-size: 1.12rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .card-hook {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      gap: 8px;
    }
    .source-name {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }
    .card-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mini-share {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.76rem;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mini-share:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .read-cta {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .read-cta:hover {
      background: var(--cyan);
      color: #060910;
    }

    /* 分頁載入更多按鈕 */
    .load-more-wrap {
      text-align: center;
      margin-top: 28px;
    }
    .load-more-btn {
      background: var(--bg-surface);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--cyan);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .load-more-btn:hover {
      background: var(--cyan);
      color: #060910;
    }

    /* 骨架屏動畫 */
    .skeleton {
      background: linear-gradient(90deg, #121b2d 25%, #1c2942 50%, #121b2d 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 16px;
      height: 310px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #10b981;
      color: #042f2e;
      font-weight: 800;
      font-size: 0.86rem;
      padding: 11px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    footer {
      margin-top: 48px;
      border-top: 1px solid var(--border);
      padding: 28px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- 1. 全球即時熱搜跑馬燈 -->
  <div class="ticker-bar">
    <div class="ticker-label"><span class="pulse-dot"></span> <span id="t-ticker">LIVE SURGING</span></div>
    <div class="ticker-track-wrap">
      <div class="ticker-track" id="ticker-track">
        <span class="ticker-item">Syncing 54 Countries Google Trends Radar...</span>
      </div>
    </div>

    function detectVisitorContext() {
      const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();
      const lang = (navigator.language || navigator.userLanguage || '').toLowerCase();

      let country = null;
      for (const [city, code] of Object.entries(TZ_COUNTRY_MAP)) {
        if (tz.includes(city)) {
          country = code;
          break;
        }
      }

      let uiLang = 'en';
      if (country === 'TW' || country === 'HK' || lang.includes('zh-tw') || lang.includes('zh-hk') || lang.includes('hant') || lang.startsWith('zh')) {
        uiLang = 'zh-TW';
      } else if (country === 'JP' || lang.startsWith('ja')) {
        uiLang = 'ja';
      } else if (country === 'BR' || country === 'PT' || lang.startsWith('pt')) {
        uiLang = 'pt';
      } else if (['MX', 'ES', 'CO', 'AR', 'PE', 'CL'].includes(country) || lang.startsWith('es')) {
        uiLang = 'es';
      }

      return { uiLang, country };
    }

    function getCountryName(cObj) {
      if (!cObj) return '';
      if (currentLang === 'zh-TW') return cObj.zh || cObj.name_zh || cObj.en;
      if (currentLang === 'ja') return cObj.ja || cObj.name_ja || cObj.en;
      return cObj.en || cObj.name_en;
    }

    function getItemRegionDisplay(item) {
      const name = currentLang === 'zh-TW' ? item.name_zh
                 : currentLang === 'ja' ? item.name_ja
                 : item.name_en;
      return `${item.flag} ${name}`;
    }

        return;

      const t = I18N[currentLang] || I18N['en'];
      btn.innerText = t.localBtn(meta.flag, getCountryName(meta));
      btn.style.display = 'inline-flex';
      btn.classList.toggle('active', currentCountry === detectedCountryCode);
    }

      const t = I18N[currentLang] || I18N['en'];

      let optionsHtml = `<option value="ALL">${t.allCountriesOpt(countriesMeta.length || 54)}</option>`;
      countriesMeta.forEach(c => {
        optionsHtml += `<option value="${c.code}">${c.flag} ${getCountryName(c)} (${c.count})</option>`;

      select.innerHTML = optionsHtml;
      select.value = prevVal;

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseTraffic(trafficStr) {
      if (!trafficStr) return 0;
      const clean = trafficStr.toUpperCase().replace(/[^0-9.KM]/g, '');
      if (clean.includes('M')) return parseFloat(clean) * 1000000;
      if (clean.includes('K')) return parseFloat(clean) * 1000;
      return parseFloat(clean) || 0;
    }

    function logClick(label) {
      try {
        const stats = JSON.parse(localStorage.getItem('sigma_clicks') || '{}');
        stats[label] = (stats[label] || 0) + 1;
        localStorage.setItem('sigma_clicks', JSON.stringify(stats));
        renderStats();
      } catch (e) {}
    }

    function resetStats() {
      localStorage.removeItem('sigma_clicks');
      renderStats();
    }

    function renderStats() {
      const params = new URLSearchParams(window.location.search);
      const panel = document.getElementById('stats-panel');
      if (params.get('stats') !== '1') return;
      panel.style.display = 'block';
      const stats = JSON.parse(localStorage.getItem('sigma_clicks') || '{}');
      const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
      document.getElementById('stats-content').innerHTML = entries.length === 0
        ? 'No clicks recorded yet'
        : entries.map(([k, v]) => `• ${esc(k)}: <strong>${v}</strong>`).join('<br>');
    }

      if (!sorted.length) return;
      const html = sorted.map(item => `
        <a class="ticker-item" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('跑馬燈-${esc(item.code)}')">
          <span>${esc(getItemRegionDisplay(item))}</span>
          <strong>${esc(item.keyword)}</strong>
          <span class="ticker-hot">${esc(item.traffic)}</span>
        </a>
      `).join('');
      document.getElementById('ticker-track').innerHTML = html + html;
    }

    function buildSmartlinkCard() {
      const t = I18N[currentLang] || I18N['en'];
      return `
        <a class="side-card smartlink-card"
           href="${SMARTLINK_URL}"
           target="_blank"
           rel="noopener noreferrer"
           onclick="logClick('Hero高轉化情報卡-${currentLang}')">
          <div>
            <span class="smartlink-tag">${t.smartTag}</span>
            <h3 class="smartlink-title">${t.smartTitle}</h3>
            <p class="smartlink-desc">${t.smartDesc}</p>
          </div>
          <div class="smartlink-cta">${t.smartCta}</div>
        </a>
      `;
    }

    function renderAll() {
      const t = I18N[currentLang] || I18N['en'];
      const sortMode = document.getElementById('sort-select').value;

      let filtered = allItems.filter(item => {
        if (currentCountry !== 'ALL') {
          if (item.code !== currentCountry) return false;
        } else if (currentGroup === 'TIER1') {
          if (!item.tier1) return false;
        } else if (currentGroup !== 'ALL') {
          if (item.group !== currentGroup) return false;
        }

        if (searchQuery) {
          const matchKw = item.keyword && item.keyword.toLowerCase().includes(searchQuery);
          const matchHk = item.hook && item.hook.toLowerCase().includes(searchQuery);
          const matchCountry = (item.name_en && item.name_en.toLowerCase().includes(searchQuery)) ||
                               (item.name_zh && item.name_zh.toLowerCase().includes(searchQuery));
          if (!matchKw && !matchHk && !matchCountry) return false;
        }
        return true;
      });

      if (sortMode === 'traffic') {
        filtered.sort((a, b) => parseTraffic(b.traffic) - parseTraffic(a.traffic));
      }

      const heroEl = document.getElementById('hero-bento');
      const gridEl = document.getElementById('trends-grid');
      const loadWrap = document.getElementById('load-more-wrap');

      if (filtered.length === 0) {
        heroEl.innerHTML = '';
        gridEl.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px 0;">${t.empty}</p>`;
        document.getElementById('result-count').innerText = t.showing(0, 0);
        loadWrap.style.display = 'none';
        return;
      }

      const top1 = filtered[0];
      const top2 = filtered[1];

      const sideTopHtml = top2 ? `
        <article class="side-card">
          <div>
            <div class="hero-badges" style="margin-bottom:8px;">
              <span class="badge-region">${esc(getItemRegionDisplay(top2))}</span>
              <span class="badge-traffic">${esc(top2.traffic)}</span>
            </div>
            <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:6px;color:#fff;">${esc(top2.keyword)}</h3>
            <p style="font-size:0.85rem;color:var(--text-sub);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(top2.hook)}</p>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="source-name">${t.sourcePrefix}${esc(top2.source)}</span>
            <div class="card-btns">
              <button class="mini-share" onclick="copyViralPost('${esc(top2.keyword)}','${esc(top2.hook)}','${esc(top2.traffic)}')">${t.shareShort}</button>
              <a class="read-cta" href="${esc(top2.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('Hero2-${esc(top2.code)}')">${t.readShort}</a>
            </div>
          </div>
        </article>
      ` : '';

      heroEl.innerHTML = `
        <article class="hero-main">
          ${top1.picture ? `<img class="hero-bg" src="${esc(top1.picture)}" alt="${esc(top1.keyword)}" onerror="this.style.display='none'">` : ''}
          <div class="hero-gradient"></div>
          <div class="hero-content">
            <div class="hero-badges">
              <span class="badge-top1">${t.top1Badge}</span>
              <span class="badge-region">${esc(getItemRegionDisplay(top1))}</span>
              <span class="badge-traffic">${esc(top1.traffic)}</span>
            </div>
            <h2 class="hero-title">${esc(top1.keyword)}</h2>
            <p class="hero-hook">${esc(top1.hook)}</p>
            <div class="hero-actions">
              <a class="btn-primary" href="${esc(top1.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('Hero1-${esc(top1.code)}')">
                ${t.readFull}
              </a>
              <button class="btn-share" onclick="copyViralPost('${esc(top1.keyword)}','${esc(top1.hook)}','${esc(top1.traffic)}')">
                ${t.shareFull}
              </button>
            </div>
          </div>
        </article>
        <div class="hero-side">
          ${sideTopHtml}
          ${buildSmartlinkCard()}
        </div>
      `;

      const rest = filtered.slice(2);
      const visibleItems = rest.slice(0, visibleLimit);
      const totalShown = Math.min(filtered.length, 2 + visibleItems.length);
      document.getElementById('result-count').innerText = t.showing(totalShown, filtered.length);

      gridEl.innerHTML = visibleItems.map(item => `
        <article class="card">
          <div class="card-media">
            ${item.picture
              ? `<img src="${esc(item.picture)}" alt="${esc(item.keyword)}" loading="lazy" onerror="this.outerHTML='<div class=\\'fallback-cover\\'><span>${esc(item.code)} TRENDING</span><div>${esc(item.keyword)}</div></div>'">`
              : `<div class="fallback-cover"><span>${esc(item.code)} TRENDING</span><div>${esc(item.keyword)}</div></div>`
            }
            <div class="media-badges">
              <span class="pill-region">${esc(getItemRegionDisplay(item))}</span>
              <span class="pill-traffic">${esc(item.traffic)}</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-keyword">${esc(item.keyword)}</h3>
            <p class="card-hook">${esc(item.hook)}</p>
            <div class="card-footer">
              <span class="source-name">${esc(item.source)}</span>
              <div class="card-btns">
                <button class="mini-share" onclick="copyViralPost('${esc(item.keyword)}','${esc(item.hook)}','${esc(item.traffic)}')">${t.shareShort}</button>
                <a class="read-cta" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" onclick="logClick('${esc(item.code)}-${esc(item.keyword)}')">
                  ${t.readShort}
                </a>
              </div>
            </div>
          </div>
        </article>
      `).join('');

      const remaining = rest.length - visibleItems.length;
      if (remaining > 0) {
        loadWrap.style.display = 'block';
        document.getElementById('load-more-btn').innerText = t.loadMore(remaining);
      } else {
        loadWrap.style.display = 'none';
      }
    }

    async function init() {
      const ctx = detectVisitorContext();
      currentLang = ctx.uiLang;
      detectedCountryCode = ctx.country;
      applyLanguageUI();
      renderStats();

      try {
        const res = await fetch('trends.json?t=' + Date.now());
        const data = await res.json();
        allItems = data.items || [];
        countriesMeta = data.countries || [];
        const cCount = data.countries_count || countriesMeta.length || 54;
        document.getElementById('brand-sub').innerText = `${cCount} COUNTRIES VIRAL RADAR`;
        document.getElementById('update-badge').innerText = `LIVE · ${data.updated_at.slice(5)}`;

        populateCountryDropdown();
        updateLocalButton();
        renderTicker();

        // 若訪客所在國家在 54 國名單內，預設先顯示該國熱搜；同時保留一鍵切回全球總覽
        if (detectedCountryCode && countriesMeta.some(c => c.code === detectedCountryCode)) {
          selectLocalCountry();
        } else {
          renderAll();
        }
      } catch (e) {
        document.getElementById('update-badge').innerText = 'OFFLINE';
      }
    }

    init();
  </script>
</body>
</html>
